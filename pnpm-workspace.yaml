# Workspace cooldown override (managed): trusted local workspace, install latest.
minimumReleaseAge: 1440

strictPeerDependencies: false
autoInstallPeers: true

allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  '@tailwindcss/oxide': true
  'core-js': true
  'core-js-pure': true
  'cypress': true
  'esbuild': true
  'msw': true
  'playwright': true
  'sharp': true
  'style-dictionary': true
  'unrs-resolver': true
  'workerd': true
